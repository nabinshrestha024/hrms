name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

# Cancel in-flight runs for the same PR / branch so a fresh push
# replaces the previous one instead of queueing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e-ci"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Prepend any command with "nx record --" to record its logs to Nx Cloud
      - run: pnpm exec nx record -- pnpm exec nx format:check --base="remotes/origin/main"
      - run: pnpm exec nx run-many -t lint typecheck test build
      # Bundle-size budget — fails CI if the initial entry exceeds 250 KB
      # raw or any non-vendor chunk exceeds 100 KB. Source of truth:
      # scripts/check-bundle-budget.mjs.
      - run: node scripts/check-bundle-budget.mjs
      # Playwright browsers — pulled here so e2e-ci can run against the
      # built app via the preview server in `playwright.config.ts`.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec nx run-many -t e2e-ci

      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - run: pnpm exec nx fix-ci
        if: always()
